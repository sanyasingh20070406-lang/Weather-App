
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App | IDEA MATES</title>

    <link rel="stylesheet" href="weather.css">
    <script src="weather.js" defer></script>
</head>

<body>

    <nav class="navbar">
        <h2>IDEA MATES</h2>
        <a href="../index.html">Back to Home</a>
    </nav>

    <main class="weather-container">

        <header class="heading">
            <p class="tag">WEATHER DASHBOARD</p>
            <h1>Check the Weather</h1>
            <p>Discover current weather conditions in any city.</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
                aria-label="Enter city name"
            >

            <button id="searchBtn">Search</button>
        </section>

        <!-- Loading and Error Messages -->
        <p id="message" class="message" aria-live="polite"></p>

        <!-- Weather Card -->
        <section id="weatherCard" class="weather-card hidden">

            <h2 id="cityName">City Name</h2>
            <p id="countryName">Country</p>

            <div class="temperature">
                <span id="temperature">--°C</span>
                <span id="weatherIcon">🌤️</span>
            </div>

            <p id="weatherDescription">Weather condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="windSpeed">-- km/h</h3>
                </div>

                <div class="detail">
                    <span>🌧️</span>
                    <p>Precipitation</p>
                    <h3 id="precipitation">-- mm</h3>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Rainfall</p>
                    <h3 id="rainfall">-- mm</h3>
                </div>

            </div>

            <p id="lastUpdated" class="last-updated"></p>

        </section>

        <footer>
            <p>Powered by Open-Meteo API</p>
        </footer>

    </main>

</body>
</html>
